# Shared by both environments (included in the server block).
client_max_body_size 20m;   # consulate lists imported through the admin

gzip on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml;

# Django REST API + Django admin
location ~ ^/(api|admin)(/|$) {
    proxy_pass http://django;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;  # tour optimisation can take a few seconds
}

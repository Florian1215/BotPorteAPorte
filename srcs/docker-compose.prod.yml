# PRODUCTION: gunicorn + Vite build (React), behind nginx.
#   Whole site on a single URL: http://<server>:${HTTP_PORT:-8080}
#     /api/, /admin/ → Django (gunicorn)    · everything else → frontend (React build)
name: canvassing

services:
  db:
    build: requirements/postgres
    image: canvassing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  backend:
    build:
      context: requirements/backend
      target: prod
    image: canvassing-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DATABASE_HOST: db
    volumes:
      - backend_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  frontend:
    build:
      context: requirements/frontend
      target: prod
    image: canvassing-frontend
    restart: unless-stopped
    networks: [frontend]

  # Only exposed service: dispatches requests between Django and the frontend
  nginx:
    build:
      context: requirements/nginx
      target: prod
    image: canvassing-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - backend_static:/srv/django-static:ro
    depends_on:
      - backend
      - frontend
    networks: [frontend]

volumes:
  db_data:
  backend_static:

networks:
  backend:
  frontend:

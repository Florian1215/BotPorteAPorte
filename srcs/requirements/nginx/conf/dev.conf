# DEVELOPMENT: everything goes through http://localhost:${HTTP_PORT}
upstream django   { server backend:8000; }
upstream frontend { server frontend:5173; }

# Websocket for Vite hot reload
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;

    # In dev, runserver serves the admin static files itself
    location ^~ /django-static/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
    }

    # Everything else: Vite dev server (React)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }
}

# PRODUCTION: everything goes through http://<server>:${HTTP_PORT}
upstream django   { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/common.conf;

    # Django admin static files (collectstatic): served directly
    location ^~ /django-static/ {
        alias /srv/django-static/;
        expires 7d;
    }

    # Everything else: React app (Vite build served by the frontend container)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $http_host;
    }
}

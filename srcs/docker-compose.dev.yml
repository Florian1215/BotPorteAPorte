# DEVELOPMENT: hot reload of the frontend and the backend.
#   Whole site on a single URL: http://localhost:${HTTP_PORT:-8080}
#     /api/, /admin/ → Django (runserver)   · everything else → Vite (React)
#   Ports can be changed in srcs/.env (HTTP_PORT, DB_DEV_PORT)
name: canvassing-dev

services:
  db:
    build: requirements/postgres
    image: canvassing-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_DEV_PORT:-5433}:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: requirements/backend
      target: dev
    image: canvassing-backend-dev
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_HOST: db
    volumes:
      - ./requirements/backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Daily jobs (06:00: closing of the tours still open). Same image; migrations are left to `backend`.
  scheduler:
    image: canvassing-backend-dev
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_HOST: db
    entrypoint: ["python", "manage.py"]
    command: ["run_scheduler"]
    volumes:
      - ./requirements/backend:/app
    depends_on:
      - backend

  frontend:
    build:
      context: requirements/frontend
      target: dev
    image: canvassing-frontend-dev
    volumes:
      - ./requirements/frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # Only exposed service: dispatches requests between Django and the frontend
  nginx:
    build:
      context: requirements/nginx
      target: dev
    image: canvassing-nginx-dev
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend

volumes:
  db_data_dev:

# Shared by both environments (included in the server block).
client_max_body_size 20m;   # consulate lists imported through the admin

gzip on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml;

# --- No indexing, no AI crawling (see robots.txt and bots.conf) ---
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

if ($deny_crawler) {
    return 403;
}

location = /robots.txt {
    alias /etc/nginx/robots.txt;
    default_type text/plain;
    charset utf-8;
    expires 1d;
}

# Django REST API + Django admin
location ~ ^/(api|admin)(/|$) {
    proxy_pass http://django;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;  # tour optimisation can take a few seconds
}

# http context (conf.d): crawlers refused with 403 even if they ignore robots.txt.
# Link-preview fetchers (WhatsApp, Telegram, Signal, Slack, facebookexternalhit…) are deliberately not listed.
map $http_user_agent $crawler_ua {
    default 0;
    "~*(gptbot|chatgpt-user|oai-searchbot|claudebot|claude-user|claude-searchbot|claude-web|anthropic-ai|ccbot|perplexitybot|perplexity-user|bytespider|amazonbot|meta-externalagent|facebookbot|cohere-ai|cohere-training-data-crawler|diffbot|youbot|ai2bot|timpibot|imagesiftbot|omgili|petalbot|duckassistbot|mistralai-user)" 1;
    "~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex(bot|images)|sogou|exabot|seznambot|qwant|mojeekbot|applebot|ahrefsbot|semrushbot|mj12bot|dotbot)" 1;
}

# robots.txt itself stays readable, so that polite crawlers learn they are not welcome.
map "$crawler_ua:$uri" $deny_crawler {
    default 0;
    "1:/robots.txt" 0;
    "~^1:" 1;
}

# Static server for the React build (frontend container, production).
# Not exposed: the nginx service (srcs/requirements/nginx) forwards everything that is not /api, /admin…
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build files => long cache
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router): any other path returns the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
